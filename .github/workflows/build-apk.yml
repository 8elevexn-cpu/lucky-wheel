name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 準備簽章金鑰（有設定 Secrets 才會使用）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "已載入簽章金鑰"
          else
            echo "::warning::未設定 KEYSTORE_BASE64，這次會用 debug 金鑰簽名，無法覆蓋安裝舊版。"
          fi

      - name: 編譯 APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 顯示簽章憑證 SHA-256（請與舊版 e28fe53a…2644d44 比對）
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/*.apk | grep -i "SHA-256" || true

      - name: 重新命名
        run: cp app/build/outputs/apk/release/app-release.apk lucky-wheel-v1.0.5.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lucky-wheel-apk
          path: lucky-wheel-v1.0.5.apk

      - name: 發佈到 Releases（可直接下載 APK）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" lucky-wheel-v1.0.5.apk \
            --title "幸運轉盤 APK #${{ github.run_number }}" \
            --notes "自動編譯的 APK，點下方 lucky-wheel-v1.0.5.apk 即可下載安裝。"
