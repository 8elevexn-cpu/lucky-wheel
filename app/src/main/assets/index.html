<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>幸運大轉盤抽獎系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <!-- Inter & Outfit Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }
        .wheel-shadow {
            filter: drop-shadow(0px 15px 30px rgba(0, 0, 0, 0.65));
        }
        .pointer-shadow {
            filter: drop-shadow(0px 6px 12px rgba(239, 68, 68, 0.6));
        }
        textarea::-webkit-scrollbar {
            width: 6px;
        }
        textarea::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        textarea::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.4), 0 0 40px rgba(245, 158, 11, 0.2); }
            50% { box-shadow: 0 0 35px rgba(245, 158, 11, 0.9), 0 0 60px rgba(245, 158, 11, 0.5); }
        }
        .glow-btn {
            animation: pulse-glow 2.2s infinite;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop-in {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        /* Pointer physics tick animation */
        .pointer-flick {
            transform: translateX(-50%) rotate(-18deg) scale(1.08) !important;
            transition: transform 0.05s ease-out;
        }
        .pointer-rest {
            transform: translateX(-50%) rotate(0deg) scale(1) !important;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Glassmorphism panel effect */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Fullscreen Wheel Mode Optimization */
        .fullscreen-active {
            position: fixed !important;
            inset: 0 !important;
            z-index: 50 !important;
            width: 100vw !important;
            height: 100vh !important;
            background-color: #020617 !important;
            padding: 1rem 1.5rem 2rem 1.5rem !important;
            border-radius: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: space-between !important;
            align-items: center !important;
            overflow: hidden !important;
            border: none !important;
        }

        .fullscreen-active .fullscreen-hide {
            display: none !important;
        }

        .fullscreen-active #wheelContainer {
            width: min(75vh, 90vw) !important;
            height: min(75vh, 90vw) !important;
            max-width: none !important;
            margin-top: auto !important;
            margin-bottom: auto !important;
        }

        .fullscreen-active #spinBtn {
            font-size: 1.5rem !important;
            padding: 1rem 3.5rem !important;
            margin-bottom: 0.5rem !important;
        }

        /* 排版整理 2026-10-04 14:35（台灣）：僅調整外觀，保留全部功能。 */
        body { line-height: 1.55; }
        body > header { padding: 16px 24px; gap: 16px; }
        body > main { max-width: 1280px; padding: 24px; gap: 24px; }
        main > section { min-width: 0; border-radius: 20px !important; box-shadow: 0 8px 24px rgba(0,0,0,.18) !important; }
        .glass-panel { background: #0f172a; }
        #wheelSection:not(.fullscreen-active) { padding: 28px; min-height: 0; }
        #wheelSection:not(.fullscreen-active) #wheelContainer { margin: 30px 0 18px; max-width: 480px; }
        #wheelSection > .fullscreen-hide { max-width: 100%; }
        #latestWinnerBanner { gap: 16px; text-align: left; }
        #latestWinnerName { min-width: 0; }
        #spinBtn { animation: pulse-glow 2.2s infinite; } /* 恢復發光脈動 */
        #spinBtn:disabled { animation: none; box-shadow: 0 4px 16px rgba(245,158,11,.2); }
        .wheel-shadow { filter: drop-shadow(0 8px 16px rgba(0,0,0,.35)); }
        main > section + section { padding: 24px; }
        main > section + section > div { margin-top: 0 !important; }
        main > section + section > div + div { padding-top: 20px; margin-top: 20px !important; border-top: 1px solid #263247; }
        main > section + section > div:first-child { padding: 16px; border-radius: 14px; }
        main > section + section > div:first-child > div:first-child { flex-direction: column; align-items: stretch; gap: 12px; }
        main > section + section > div:first-child > div:first-child > div { display: grid; grid-template-columns: 1fr 1fr 1.5fr 44px; gap: 8px; }
        main > section + section label, main > section + section span.text-xs { font-size: 13px; letter-spacing: 0; }
        main > section + section input[type=text], main > section + section select, main > section + section textarea { font-size: 14px; line-height: 1.6; border-radius: 10px; }
        main > section + section select, main > section + section input[type=text] { min-height: 44px; padding: 10px 12px; }
        main > section + section button { min-height: 40px; font-size: 13px; justify-content: center; white-space: nowrap; }
        #clearItemsBtn, #clearHistoryBtn { min-height: 32px; }
        #itemsInput { min-height: 180px; padding: 12px; }
        #itemsInput + button { min-height: 44px; }
        #historyList { max-height: 160px; padding: 12px; font-size: 13px; }
        #soundSelect { min-width: 0; }
        #uploadAudioBtn { flex-shrink: 0; }
        select option { background: #0f172a; color: #e2e8f0; }
        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #fbbf24; outline-offset: 3px; }
        @media (min-width: 1024px) {
            body > main { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
            main > section { grid-column: auto !important; }
        }
        @media (max-width: 639px) {
            body > header { padding: 12px 16px; }
            body > header > div:last-child { width: 100%; justify-content: space-between; }
            body > header > div:last-child > div { flex: 1; min-width: 0; }
            #headerWheelSelect { flex: 1; min-width: 0; max-width: none; min-height: 36px; font-size: 13px; }
            #fullscreenBtn { min-width: 44px; min-height: 44px; justify-content: center; }
            body > main { padding: 16px; gap: 16px; }
            #wheelSection:not(.fullscreen-active), main > section + section { padding: 18px; }
            #wheelSection:not(.fullscreen-active) #wheelContainer { margin-top: 32px; }
            #latestWinnerBanner { flex-wrap: wrap; gap: 6px; }
            #latestWinnerName { max-width: 100%; }
            main > section + section > div:first-child { padding: 12px; }
            main > section + section > div:first-child > div:first-child > div { grid-template-columns: 1fr 1fr 1.4fr 40px; gap: 6px; }
            main > section + section > div:first-child button { padding-left: 6px; padding-right: 6px; font-size: 12px; }
            main > section + section label.cursor-pointer { padding: 12px 10px; gap: 8px; }
            main > section + section label.cursor-pointer .text-slate-500 { font-size: 11px; }
            label[for=itemsInput] { max-width: 72%; }
        }
    
/* v3｜2026-10-04 15:04 台灣｜即時設定列與集中轉盤管理 */
[hidden] { display:none !important; }
body > main { display:flex !important;flex-direction:column;max-width:1000px; }
body > main > section { width:100%; }
.app-pages { display:flex;gap:8px; }
.app-pages button { min-height:44px;padding:10px 16px;border:1px solid #334155;border-radius:10px;background:#1e293b;color:#cbd5e1;font-size:14px;font-weight:700; }
.app-pages button[aria-pressed=true] { background:#f59e0b;color:#0f172a;border-color:#f59e0b; }
#liveBar { width:100%;display:flex;align-items:center;gap:8px;flex-shrink:0;position:relative;z-index:31;margin-bottom:12px; }
#liveControls { display:flex;align-items:end;gap:8px;flex:1;min-width:0;overflow-x:auto;padding:3px 2px 8px; }
.live-field { display:flex;flex-direction:column;gap:4px;flex:1;min-width:115px; }
.live-field > span { font-size:11px;color:#94a3b8;white-space:nowrap; }
#liveControls select { min-height:40px;width:100%;max-width:none;margin:0;padding:8px 10px;background:#020617;border:1px solid #334155;border-radius:9px;color:#e2e8f0;font-size:13px;font-weight:600; }
#liveControls .wheel-field { min-width:150px;flex:1.4; }
#liveBar #simExitFullscreenBtn { position:static !important;flex-shrink:0;margin-top:18px;min-height:40px; }
#liveBar #uploadAudioBtn { flex-shrink:0;align-self:end;margin-bottom:8px; }
#drawModeSource { display:none !important; }
#historyMenu { position:relative;flex-shrink:0;align-self:end;margin-bottom:8px; }
#historyMenu > summary { cursor:pointer;min-height:40px;padding:9px 12px;border:1px solid #334155;border-radius:9px;font-size:13px;background:#1e293b;list-style:none; }
#historyMenu > div { position:absolute;top:48px;right:0;width:min(320px,78vw);padding:14px;background:#0f172a;border:1px solid #475569;border-radius:12px;box-shadow:0 12px 32px #0008; }
#historyList { max-height:25vh; }
#managerPage { padding:24px; }
#managerPage > div { margin:0 !important;border:0;padding:0; }
#managerPage > div + div { padding-top:20px;margin-top:20px !important;border-top:1px solid #263247; }
#manageTop { display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center; }
#manageActions { grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap; }
#manageTop select, #managerPage input[type=text], #managerPage textarea { width:100%;min-width:0;min-height:44px;font-size:14px;line-height:1.6;padding:12px; }
#managerPage button { min-height:44px;justify-content:center;font-size:13px;white-space:nowrap; }
#managerPage label { font-size:14px; }
#managerPage #itemsInput { min-height:260px; }
#managerPage #deleteWheelBtn { margin-top:12px; }
#managerPage .version-info { font-size:12px;color:#94a3b8;line-height:1.8; }
#wheelSection.fullscreen-active { padding:12px 16px 18px !important;height:100dvh !important; }
.fullscreen-active #wheelContainer { width:min(64vh,86vw,calc(100dvh - 180px)) !important;height:min(64vh,86vw,calc(100dvh - 180px)) !important;flex-shrink:0; }
.fullscreen-active #spinBtn { padding:12px 32px !important;font-size:20px !important;flex-shrink:0; }
@media(max-width:639px) { #wheelSection:not(.fullscreen-active),#managerPage { padding:16px; } body > header { flex-wrap:wrap; } .app-pages { width:100%; } .app-pages button { flex:1; } #manageTop { grid-template-columns:minmax(0,1fr) auto; } #manageTop button { padding:10px; } #liveBar { gap:6px; } #historyMenu > summary { padding:9px 8px; } #liveBar #simExitFullscreenBtn span { display:none; } #liveBar #simExitFullscreenBtn { padding:10px; } }

/* 放大獨立轉盤頁，配合螢幕高度保留控制列與抽獎鍵。 */
body > main { max-width:1200px;padding:16px; }
#wheelSection:not(.fullscreen-active) { padding:16px 20px; }
#wheelSection:not(.fullscreen-active) #wheelContainer { width:min(100%,780px,max(240px,calc(100dvh - 280px)));max-width:none;margin:26px 0 12px;flex-shrink:0; }
#wheelSection #latestWinnerBanner { max-width:780px; }
#wheelSection > div.fullscreen-hide:first-of-type { padding-top:6px;padding-bottom:6px; }
#wheelSection.fullscreen-active #wheelContainer { width:min(92vw,calc(100dvh - 156px)) !important;height:min(92vw,calc(100dvh - 156px)) !important; }
@media(max-height:500px) { #wheelSection.fullscreen-active { padding:6px 12px !important; } .fullscreen-active #liveBar { margin-bottom:0; } #wheelSection.fullscreen-active #wheelContainer { width:min(85vw,calc(100dvh - 128px)) !important;height:min(85vw,calc(100dvh - 128px)) !important; } .fullscreen-active #spinBtn { padding:8px 24px !important;font-size:16px !important;margin:0 !important; } }

/* 2026-10-04 15:07 台灣：開始抽獎按鈕縮小 20%；音訊點擊啟動、五種新增音效與試聽；轉盤文字放大約 20%、加粗、純黑字、無描邊；全螢幕雙指可拉近至 5 倍並單指平移，取消滑桿與畫面邊界限制；文字設定合為小型選單，字級與字色各自下拉並保留自訂；預設白字、字級稍大、無描邊；完成可收起鍵盤。 */
#spinBtn { font-size:16px !important;padding:11.2px 32px !important;gap:9.6px !important; }
#wheelSection.fullscreen-active #spinBtn { font-size:16px !important;padding:9.6px 25.6px !important; }
@media(max-height:500px) { #wheelSection.fullscreen-active #spinBtn { font-size:12.8px !important;padding:6.4px 19.2px !important; } }

#previewSoundBtn { min-height:40px;padding:8px 10px;font-size:13px;white-space:nowrap;flex-shrink:0;align-self:end;margin-bottom:8px; }
#liveControls .live-field:last-child { min-width:125px; }



/* v3.6：小型文字設定與可拉近查看名字的手勢。 */
#liveControls .text-style-field { display:none;flex:none;min-width:0; }
.fullscreen-active #liveControls .text-style-field { display:flex; }
.text-style-inputs { display:flex;align-items:center;gap:5px; }
#labelFontSize { width:56px;height:34px;padding:4px 5px;background:#020617;border:1px solid #334155;border-radius:7px;color:#e2e8f0;font-size:12px; }
#labelFontColor { width:34px;height:34px;padding:3px;background:#020617;border:1px solid #334155;border-radius:7px;cursor:pointer; }
.fullscreen-active #liveControls { gap:6px; }
.fullscreen-active .live-field { min-width:95px;gap:2px; }
.fullscreen-active #liveControls .wheel-field { min-width:115px; }
.fullscreen-active #liveControls .live-field > span { font-size:10px; }
.fullscreen-active #liveControls select { min-height:34px;padding:6px;font-size:12px;border-radius:7px; }
.fullscreen-active #liveControls .live-field:last-child { min-width:0; }
#wheelSection.fullscreen-active #wheelContainer { touch-action:none;transform:translate(var(--wheelPanX,0px),var(--wheelPanY,0px)) scale(var(--wheelZoom,1));transform-origin:center;transition:none !important;z-index:0; }

/* v3.7：文字小選單，字級／字色各自下拉。 */
#textMenu { display:none;position:relative;flex-shrink:0;align-self:end;margin-bottom:8px; }
.fullscreen-active #textMenu { display:block; }
#textMenu > summary { min-height:40px;padding:9px 10px;border:1px solid #334155;border-radius:9px;background:#1e293b;color:#e2e8f0;font-size:13px;cursor:pointer;list-style:none; }
#textMenu .text-popover { position:absolute;right:0;top:48px;width:220px;padding:12px;border:1px solid #475569;border-radius:12px;background:#0f172a;box-shadow:0 12px 28px #0008;display:grid;gap:10px; }
#textMenu label { display:grid;gap:5px;color:#cbd5e1;font-size:12px; }
#textMenu select,#textMenu input[type=number] { min-height:40px;width:100%;padding:8px;border:1px solid #334155;border-radius:8px;background:#020617;color:#e2e8f0;font-size:14px; }
#textMenu input[type=color] { width:100%;height:40px;background:#020617;border:1px solid #334155;border-radius:8px; }
#textMenu button { min-height:40px;border:1px solid #334155;border-radius:8px;background:#1e293b;color:#e2e8f0;font-size:13px; }

/* v3.10：小手機版面再精簡（不改任何功能）。
   - 標題列：隱藏副標題，轉盤／轉盤管理／全螢幕鈕併成同一列
   - 隱藏「目前轉盤／風格」資訊列（標題與選單已顯示）
   - 四個下拉併成一列、標籤隱藏；文字／試聽／紀錄一列
   - 「文字」設定在一般畫面也能使用 */
#textMenu { display:block; }
/* 平板／全螢幕單列時，音效欄位不再被擠到看不見：每欄有最小寬度且不縮，空間不夠就在列內左右捲動 */
.fullscreen-active #liveControls .live-field,
.fullscreen-active #liveControls .live-field:last-child { flex:1 0 104px;min-width:104px; }
.fullscreen-active #liveControls .wheel-field { flex:1.3 0 124px;min-width:124px; }
/* 退出滿版鈕：只留圖示、不顯示文字，不再擠掉音效欄位 */
#liveBar #simExitFullscreenBtn {
  flex:0 0 38px;width:38px;min-width:38px;max-width:38px;min-height:38px;height:38px;
  padding:0;margin:0 0 8px;gap:0;justify-content:center;font-size:0;
}
#liveBar #simExitFullscreenBtn span { display:none !important; }
#liveBar #simExitFullscreenBtn i { display:inline-block;margin:0;font-size:15px; }
@media (max-width:639px) {
  body > header { padding:max(8px,env(safe-area-inset-top,0px)) 12px 8px;gap:6px;flex-wrap:wrap; }
  body > header > div:first-child { flex:1 1 100%; }
  body > header > div:first-child > div:first-child { width:32px;height:32px;font-size:16px;border-radius:10px; }
  body > header > div:first-child p { display:none; }
  body > header .app-pages { flex:1 1 0;width:auto;min-width:0;gap:6px; }
  body > header .app-pages button { min-height:38px;padding:6px 10px;font-size:14px; }
  body > header > div:last-child { width:auto;flex:0 0 auto; }
  body > header > div:last-child > div { flex:none; }
  body > header #fullscreenBtn { min-width:38px;min-height:38px;padding:0;justify-content:center; }

  body > main { padding:8px;gap:8px; }
  #wheelSection:not(.fullscreen-active) { padding:10px; }
  #wheelSection > div:has(> div > #activeWheelBadge) { display:none !important; }
  #wheelSection:not(.fullscreen-active) #wheelContainer { margin-top:28px; }

  #liveBar { flex-wrap:wrap;align-items:stretch;gap:6px; }
  #liveControls {
    flex:1 1 100%;display:grid;grid-template-columns:1.3fr 1fr 1.1fr 1fr;
    align-items:stretch;gap:4px;overflow:visible;padding:0;
  }
  #liveControls .live-field,
  #liveControls .wheel-field,
  #liveControls .live-field:last-child,
  .fullscreen-active #liveControls .live-field,
  .fullscreen-active #liveControls .wheel-field,
  .fullscreen-active #liveControls .live-field:last-child { display:block;flex:none;min-width:0;margin:0; }
  #liveControls .live-field > span {
    position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;
  }
  #liveControls select {
    -webkit-appearance:none;appearance:none;width:100%;min-width:0;min-height:36px;
    padding:6px 15px 6px 6px;font-size:12px;font-weight:600;border-radius:8px;
    text-overflow:ellipsis;white-space:nowrap;overflow:hidden;
    background-image:linear-gradient(45deg,transparent 50%,#94a3b8 50%),linear-gradient(135deg,#94a3b8 50%,transparent 50%);
    background-position:calc(100% - 9px) 50%,calc(100% - 5px) 50%;
    background-size:4px 4px,4px 4px;background-repeat:no-repeat;
  }
  #liveBar > button,#liveBar > details { flex:1 1 0;margin:0;align-self:stretch; }
  #liveBar > details > summary,#liveBar > button { min-height:36px;padding:7px 4px;font-size:12px;text-align:center;white-space:nowrap; }
  #liveBar #simExitFullscreenBtn { margin:0;flex:0 0 36px;width:36px;min-width:36px;max-width:36px;align-self:stretch;height:auto;min-height:36px; }
  #textMenu .text-popover { left:0;right:auto; }

  #wheelSection.fullscreen-active {
    padding:max(10px,env(safe-area-inset-top,0px)) 12px max(14px,env(safe-area-inset-bottom,0px)) !important;
    justify-content:flex-start !important;gap:8px;
  }
  .fullscreen-active #liveBar { margin-bottom:0; }
  #wheelSection.fullscreen-active #wheelContainer {
    width:min(94vw,calc(100dvh - 260px)) !important;height:min(94vw,calc(100dvh - 260px)) !important;
    margin-top:auto !important;margin-bottom:auto !important;
  }
  #wheelSection.fullscreen-active #spinBtn { margin-bottom:calc(env(safe-area-inset-bottom,0px) + 44px) !important; }
}
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-full flex flex-col selection:bg-amber-500 selection:text-slate-900 overflow-x-hidden">

    <header class="border-b border-slate-800/80 bg-slate-900/80 backdrop-blur-md sticky top-0 z-30 px-4 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 via-amber-400 to-orange-500 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-amber-500/20">
                <i class="fa-solid fa-dharmachakra"></i>
            </div>
            <div>
                <h1 id="appHeaderTitle" class="text-lg font-black bg-gradient-to-r from-amber-300 via-amber-400 to-orange-400 bg-clip-text text-transparent font-outfit">幸運大轉盤</h1>
                <p class="text-[11px] text-slate-400 font-medium">炫光視覺與自訂多轉盤抽獎系統</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <!-- Header Quick Wheel Selector -->
            <div class="relative flex items-center bg-slate-800/80 rounded-xl p-1 border border-slate-700/80">
                <i class="fa-solid fa-layer-group text-amber-400 text-xs ml-2.5 mr-1.5"></i>
                <select id="headerWheelSelect" class="bg-transparent text-xs text-slate-200 font-bold focus:outline-none pr-2 cursor-pointer max-w-[130px] sm:max-w-[180px] truncate">

    <script>
        class SoundEngine {
            constructor() {
                this.audioCtx = null;
                this.customBuffer = null;
                this.mode = 'default';
            }

            init() {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.audioCtx.state !== 'running') {
                    return this.audioCtx.resume();
                }
                return Promise.resolve();
            }

            playTick() {
                if (this.mode === 'none') return;
                this.init();

                if (this.mode === 'custom' && this.customBuffer) {
                    this.playBuffer(this.customBuffer);
                    return;
                }

                const presets = {
                    default: ['triangle',880,110,0.03,0.2],
                    wood: ['triangle',420,75,0.045,0.35],
                    bell: ['sine',1760,1320,0.12,0.22],
                    arcade: ['square',980,490,0.055,0.09],
                    water: ['sine',1050,260,0.09,0.24],
                    drum: ['sine',190,45,0.085,0.45]
                };
                const [type,start,end,duration,volume] = presets[this.mode] || presets.default;
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                const time = this.audioCtx.currentTime;
                osc.type = type;
                osc.frequency.setValueAtTime(start,time);
                osc.frequency.exponentialRampToValueAtTime(end,time+duration);
                gain.gain.setValueAtTime(volume,time);
                gain.gain.exponentialRampToValueAtTime(0.001,time+duration);
                osc.connect(gain);gain.connect(this.audioCtx.destination);
                osc.start(time);osc.stop(time+duration);
                osc.onended = () => { osc.disconnect();gain.disconnect(); };
            }

            playWinFanfare() {
                if (this.mode === 'none') return;
                this.init();

                const melodies = {
                    wood:[392,493.88,587.33,783.99], bell:[783.99,987.77,1174.66,1567.98],
                    arcade:[523.25,783.99,1046.5,1567.98], water:[659.25,783.99,987.77,1318.51],
                    drum:[261.63,329.63,392,523.25]
                };
                const notes = melodies[this.mode] || [523.25,659.25,783.99,1046.5];
                notes.forEach((freq, idx) => {
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();
                    
                    osc.type = this.mode === 'arcade' ? 'triangle' : 'sine';
                    osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime + idx * 0.08);
                    
                    gain.gain.setValueAtTime(0.25, this.audioCtx.currentTime + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + idx * 0.08 + 0.45);
                    
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    
                    osc.start(this.audioCtx.currentTime + idx * 0.08);
                    osc.stop(this.audioCtx.currentTime + idx * 0.08 + 0.45);
                });
            }

            playBuffer(buffer) {
                const source = this.audioCtx.createBufferSource();
                source.buffer = buffer;
                source.connect(this.audioCtx.destination);
                source.start(0);
            }

            async loadCustomAudioFile(file) {
                this.init();
                const arrayBuffer = await file.arrayBuffer();
                this.customBuffer = await this.audioCtx.decodeAudioData(arrayBuffer);
            }
        }

        const soundEngine = new SoundEngine();
    </script>

        function getWinningIndex() {
            const numOptions = items.length;
            if (numOptions === 0) return -1;
            const arcSize = (2 * Math.PI) / numOptions;
            
            let relativePointerAngle = (1.5 * Math.PI - (startAngle % (2 * Math.PI))) % (2 * Math.PI);
            if (relativePointerAngle < 0) {
                relativePointerAngle += 2 * Math.PI;
            }
            return Math.floor(relativePointerAngle / arcSize) % numOptions;
        }

        const wheelTextStyle = {size:null,color:'#ffffff',version:7};
        try {
            const saved = JSON.parse(localStorage.getItem('lucky_wheel_text_style') || 'null');
            if(saved) {
                if(Number.isFinite(saved.size) && saved.size>=8 && saved.size<=96) wheelTextStyle.size=saved.size;
                if(saved.version===7 && /^#[0-9a-f]{6}$/i.test(saved.color)) wheelTextStyle.color=saved.color;
            }
        } catch(e) {}

        function drawWheel(winningIdx = -1) {
            const numOptions = items.length;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const outerMargin = 32;
            const radius = canvas.width / 2 - outerMargin;

            const currentThemeKey = themeSelect.value || 'carnival';
            const currentSkin = THEME_SKINS[currentThemeKey] || THEME_SKINS.carnival;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (numOptions === 0) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.fillStyle = '#0f172a';
                ctx.fill();
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 6;
                ctx.stroke();

                ctx.fillStyle = '#64748b';
                ctx.font = 'bold 24px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('請到轉盤管理新增抽獎選項', centerX, centerY);
                itemCountBadge.textContent = '目前沒有抽獎項目';
                return;
            }

            itemCountBadge.textContent = `目前共有 ${numOptions} 個抽獎項目`;
            const arcSize = (2 * Math.PI) / numOptions;

            let fontSize = 32;
            if (numOptions > 20) fontSize = 21;
            else if (numOptions > 12) fontSize = 24;
            else if (numOptions > 8) fontSize = 28;

            for (let i = 0; i < numOptions; i++) {
                const angle = startAngle + i * arcSize;
                const isWinner = (i === winningIdx);
                
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize, false);
                ctx.arc(centerX, centerY, 0, angle + arcSize, angle, true);
                
                const segmentColor = isWinner ? '#fef08a' : currentSkin.colors[i % currentSkin.colors.length];
                ctx.fillStyle = segmentColor;
                ctx.fill();

                ctx.strokeStyle = isWinner ? '#ffffff' : '#0f172a';
                ctx.lineWidth = isWinner ? 8 : 3;
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                
                const textColor = wheelTextStyle.color;
                let text = items[i];
                const maxChars = numOptions > 16 ? 10 : 16;
                if (text.length > maxChars) text = text.substring(0, maxChars - 1) + '…';
                // Keep long names inside the available radial space and narrow segments.
                const maxWidth = radius * 0.83 - 72;
                let labelSize;
                let drawText = text;
                if (wheelTextStyle.size) {
                    // 使用者指定字級：照指定大小畫，名字太長就以「…」縮短，字不再被自動縮小
                    labelSize = wheelTextStyle.size;
                    ctx.font = `900 ${labelSize}px Inter, "Noto Sans TC", sans-serif`;
                    while (drawText.length > 1 && ctx.measureText(drawText).width > maxWidth) {
                        drawText = drawText.replace(/…$/, '').slice(0, -1) + '…';
                    }
                } else {
                    // 自動字級：依扇形與名字長度自動縮放
                    labelSize = Math.min(fontSize + (isWinner ? 4 : 0),
                        numOptions <= 2 ? 36 : Math.max(8, 2 * radius * 0.60 * Math.sin(arcSize / 2) - 4));
                    ctx.font = `900 ${labelSize}px Inter, "Noto Sans TC", sans-serif`;
                    while (labelSize > 8 && ctx.measureText(text).width > maxWidth) {
                        labelSize -= 0.5;
                        ctx.font = `900 ${labelSize}px Inter, "Noto Sans TC", sans-serif`;
                    }
                }
                ctx.fillStyle = textColor;
                ctx.fillText(drawText, radius * 0.83, 0, maxWidth);
                ctx.restore();
            }

            // Outer Ring & LED Bulbs
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 14, 0, 2 * Math.PI);
            ctx.lineWidth = 26;
            ctx.strokeStyle = currentSkin.rimColor;
            ctx.stroke();

            const numLeds = 28;
            for (let i = 0; i < numLeds; i++) {
                const ledAngle = (i * (2 * Math.PI / numLeds)) + (isSpinning ? ledStep * 0.1 : 0);
                const ledX = centerX + (radius + 14) * Math.cos(ledAngle);
                const ledY = centerY + (radius + 14) * Math.sin(ledAngle);
                
                const isLit = (i + Math.floor(ledStep)) % 2 === 0;

                ctx.beginPath();
                ctx.arc(ledX, ledY, 7, 0, 2 * Math.PI);
                ctx.fillStyle = isLit ? currentSkin.ledOn : currentSkin.ledOff;
                ctx.fill();
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
            ctx.restore();

            if (winningIdx >= 0) {
                const angle = startAngle + winningIdx * arcSize;
                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize, false);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 12;
                ctx.stroke();
                ctx.restore();
            }
        }

        function rotateWheel() {
            if (isSpinning) return;
            if (items.length < 2) {
                showToast('請至少輸入 2 個選項才能開始抽獎！', 'warning');
                return;
            }

            isSpinning = true;
            highlightWinnerIndex = -1;
            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50', 'cursor-not-allowed');

            const spinAngleStart = Math.random() * 10 + 14;
            let spinTime = 0;
            const spinTimeTotal = Math.random() * 3000 + 4800;

            function rotate() {
                spinTime += 30;
                ledStep += 0.35;

                if (spinTime >= spinTimeTotal) {
                    finishSpin();
                    return;
                }

                const progress = spinTime / spinTimeTotal;
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const spinAngle = spinAngleStart * (1 - easeOut);
                
                startAngle += (spinAngle * Math.PI / 180);
                drawWheel();

                const currentSegment = getWinningIndex();
                if (currentSegment !== lastSegmentIndex && currentSegment >= 0) {
                    soundEngine.playTick();
                    
                    pointerArrow.classList.remove('pointer-rest');
                    pointerArrow.classList.add('pointer-flick');
                    setTimeout(() => {
                        pointerArrow.classList.remove('pointer-flick');
                        pointerArrow.classList.add('pointer-rest');
                    }, 50);

                    lastSegmentIndex = currentSegment;
                }

                animationFrameId = requestAnimationFrame(rotate);
            }

            rotate();
        }

        function finishSpin() {
            isSpinning = false;
            spinBtn.disabled = false;
            spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            const index = getWinningIndex();

            drawWheel(index);

        // 每個轉盤各自保存中獎紀錄（存在該轉盤資料內，隨 localStorage 保存、匯出／匯入一併還原）。
        function renderWheelHistory() {
            const wheel = getCurrentActiveWheel();
            const list = (wheel && Array.isArray(wheel.history)) ? wheel.history : [];
            winningHistory = list;
            latestWinnerName.textContent = (wheel && wheel.latest) ? wheel.latest : '尚未開始抽獎';

            historyList.innerHTML = list.map(h => `

        function addHistoryRecord(item) {
            const wheel = getCurrentActiveWheel();

            wheel.history.unshift({ item, time: timeStr });
            if (wheel.history.length > 200) wheel.history.pop();
            wheel.latest = item;
            saveWheelsToLocalStorage();
            renderWheelHistory();
        }

                } catch (err) {

        function toggleFullscreen() {
            const getFsElement = () => document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;

            if (isSimulatedFullscreen || getFsElement()) {
                exitSimulatedFullscreen();
                return;
            }

            const docEl = document.documentElement;
            const reqFn = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;

            if (reqFn) {
                const promise = reqFn.call(docEl);
                if (promise && typeof promise.then === 'function') {
                    promise.then(() => {
                        enableFullscreenStyles();
                        showToast('已開啟全螢幕模式', 'success');
                    }).catch((err) => {
                        enterSimulatedFullscreen();
                    });
                } else {
                    setTimeout(() => {
                        if (!getFsElement()) {
                            enterSimulatedFullscreen();
                        } else {
                            enableFullscreenStyles();
                            showToast('已開啟全螢幕模式', 'success');
                        }
                    }, 100);
                }
            } else {
                enterSimulatedFullscreen();
            }
        }

        function enterSimulatedFullscreen() {
            isSimulatedFullscreen = true;
            enableFullscreenStyles();
            showToast('已進入極簡大轉盤模式', 'info');
        }

        function exitSimulatedFullscreen() {
            isSimulatedFullscreen = false;
            if (document.fullscreenElement) {
                const exitFn = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                if (exitFn) exitFn.call(document);
            }
            disableFullscreenStyles();
            showToast('已退出滿版模式', 'info');
        }

        const onFsChange = () => {
            const fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
            if (fsEl) {
                enableFullscreenStyles();
            } else if (!isSimulatedFullscreen) {
                disableFullscreenStyles();
            }
        };

        document.addEventListener('fullscreenchange', onFsChange);
        document.addEventListener('webkitfullscreenchange', onFsChange);
        document.addEventListener('mozfullscreenchange', onFsChange);
        document.addEventListener('MSFullscreenChange', onFsChange);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                exitSimulatedFullscreen();
            }
        });

        fullscreenBtn.addEventListener('click', toggleFullscreen);
        simExitFullscreenBtn.addEventListener('click', exitSimulatedFullscreen);

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const typeStyles = {
                success: 'bg-emerald-950/90 border-emerald-500 text-emerald-200',
                warning: 'bg-amber-950/90 border-amber-500 text-amber-200',
                info: 'bg-slate-900/90 border-amber-500/50 text-slate-200'
            };

            const icons = {
                success: 'fa-circle-check text-emerald-400',
                warning: 'fa-triangle-exclamation text-amber-400',
                info: 'fa-circle-info text-amber-400'
            };

            toast.className = `pointer-events-auto flex items-center gap-3 border px-4 py-3 rounded-2xl shadow-2xl text-xs backdrop-blur-md transition-all transform translate-y-4 opacity-0 ${typeStyles[type] || typeStyles.info}`;
            toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-base"></i><span>${message}</span>`;

            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        spinBtn.addEventListener('click', rotateWheel);
        canvas.addEventListener('click', rotateWheel);

        window.addEventListener('load', () => {
            loadWheelsFromLocalStorage();
            loadActiveWheelToForm();
        });
    </script>

<script>
// 放大可超出畫面；雙指以手指中心缩放，單指平移，防止拖曳後誤抽。
(() => {
 const wheel=document.getElementById('wheelSection'),area=document.getElementById('wheelContainer');
 let scale=1,x=0,y=0,state=null,blockUntil=0,hadGesture=false;
 const distance=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
 function apply(){wheel.style.setProperty('--wheelZoom',String(scale));wheel.style.setProperty('--wheelPanX',x+'px');wheel.style.setProperty('--wheelPanY',y+'px');}
 function begin(e){
  if(!wheel.classList.contains('fullscreen-active'))return;
  if(e.touches.length===2){e.preventDefault();hadGesture=true;const rect=area.getBoundingClientRect();state={kind:'pinch',d:distance(e.touches),scale,x,y,cx:(rect.left+rect.right)/2-x,cy:(rect.top+rect.bottom)/2-y};}
  else if(e.touches.length===1){const t=e.touches[0];state={kind:'pan',tx:t.clientX,ty:t.clientY,x,y};}
 }
 function move(e){
  if(!state||!wheel.classList.contains('fullscreen-active'))return;
  if(e.touches.length===2){if(state.kind!=='pinch'){begin(e);return;}e.preventDefault();const t=e.touches,mx=(t[0].clientX+t[1].clientX)/2,my=(t[0].clientY+t[1].clientY)/2;const next=Math.max(.3,Math.min(5,state.scale*distance(t)/Math.max(1,state.d))),ratio=next/state.scale;x=mx-state.cx-(mx-state.cx-state.x)*ratio;y=my-state.cy-(my-state.cy-state.y)*ratio;scale=next;hadGesture=true;apply();}
  else if(e.touches.length===1&&state.kind==='pan'){const dx=e.touches[0].clientX-state.tx,dy=e.touches[0].clientY-state.ty;if(Math.hypot(dx,dy)>6||hadGesture){e.preventDefault();hadGesture=true;x=state.x+dx;y=state.y+dy;apply();}}
 }
 function end(e){if(hadGesture)blockUntil=Date.now()+650;if(e.touches.length){begin(e);}else{state=null;hadGesture=false;}}
 area.addEventListener('touchstart',begin,{passive:false});area.addEventListener('touchmove',move,{passive:false});area.addEventListener('touchend',end,{passive:false});area.addEventListener('touchcancel',()=>{state=null;hadGesture=false;blockUntil=Date.now()+650;},{passive:false});
 area.addEventListener('click',e=>{if(hadGesture||Date.now()<blockUntil){e.preventDefault();e.stopImmediatePropagation();}},true);
 // Entering fullscreen starts with the complete wheel in view.
 new MutationObserver(()=>{if(!wheel.classList.contains('fullscreen-active')){scale=1;x=0;y=0;state=null;apply();}}).observe(wheel,{attributes:true,attributeFilter:['class']});

})();
